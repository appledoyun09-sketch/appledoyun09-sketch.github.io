name: TOKYO INTELLIGENCE Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - tokyo-intelligence-v02
    paths:
      - 'android/**'
      - '.github/workflows/build-tokyo-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    name: Compile Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify and install Android SDK packages
        run: |
          echo "SDK at ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          command -v sdkmanager || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle self-contained web app into APK
        run: |
          mkdir -p android/app/src/main/assets
          cp -a tokyo/. android/app/src/main/assets/
          test -s android/app/src/main/assets/index.html
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Store installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TOKYO_INTELLIGENCE_v0.2_debug_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
