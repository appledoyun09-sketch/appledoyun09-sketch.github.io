 ink:$('inkCanvas'),live:$('liveCanvas'),editor:$('textEditor'),palette:$('palette'),toolGroup:$('toolGroup'),
 size:$('sizeSlider'),sizeLabel:$('sizeLabel'),widthPreview:$('widthPreview'),saveStatus:$('saveStatus'),storageStatus:$('storageStatus'),

function initialData(){
 const school={id:uid(),name:'학교 공부',color:'#6c71e8'};
 const personal={id:uid(),name:'내 노트',color:'#43b79c'};
 const note=makeNote(school.id,'첫 번째 노트');

function currentNote(){return data?.notes.find(n=>n.id===data.activeNoteId) || data?.notes[0];}

function currentBook(){return data.notebooks.find(b=>b.id===data.activeNotebookId)||data.notebooks[0];}
function hexToRgb(hex){const val=hex.replace('#','');return {r:parseInt(val.slice(0,2),16),g:parseInt(val.slice(2,4),16),b:parseInt(val.slice(4,6),16)};}
function formatDate(t){let d=new Date(t);return (d.getMonth()+1)+'월 '+d.getDate()+'일';}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function showToast(text,ms=2700){el.toast.textContent=text;el.toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.toast.classList.remove('show'),ms);}
function openDB(){return new Promise(resolve=>{
 if(!('indexedDB' in window)){resolve(null);return;}
 try{let req=indexedDB.open('lumi_notes_database',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('data'))req.result.createObjectStore('data');};req.onsuccess=()=>resolve(req.result);req.onerror=()=>resolve(null);}catch(e){resolve(null);}
});}
async function loadState(){db=await openDB();let found=null;
 if(db){try{found=await new Promise((resolve,reject)=>{let tx=db.transaction('data','readonly');let req=tx.objectStore('data').get('state');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}catch(e){console.warn('IndexedDB read failed',e);}}
 if(!found){try{found=JSON.parse(localStorage.getItem('lumi_state'));}catch(e){}}
 if(!found||!Array.isArray(found.notes)||!Array.isArray(found.notebooks))found=initialData();
 data=found;data.settings??={dark:false,penOnly:true};data.pageIndex??=0;
 if(!data.notebooks.length || !data.notes.length)data=initialData();
 if(!data.notes.some(n=>n.id===data.activeNoteId))data.activeNoteId=data.notes[0].id;
 if(!data.notebooks.some(b=>b.id===data.activeNotebookId))data.activeNotebookId=data.notebooks[0].id;
}
async function writeState(){if(!data)return;
 const snapshot=copy(data);
 try{
  if(db){await new Promise((resolve,reject)=>{let tx=db.transaction('data','readwrite');tx.objectStore('data').put(snapshot,'state');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}
  else{localStorage.setItem('lumi_state',JSON.stringify(snapshot));}
  el.saveStatus.textContent='저장됨';el.storageStatus.textContent='이 기기에 자동 저장';
 }catch(e){console.error('Save failed',e);el.saveStatus.textContent='저장 오류';el.storageStatus.textContent='저장 용량을 확인하세요';showToast('저장에 실패했습니다. JSON 백업을 먼저 내려받으세요.',4800);}

function queueSave(){const n=currentNote();if(n)n.updatedAt=Date.now();el.saveStatus.textContent='저장 중…';clearTimeout(saveTimer);saveTimer=setTimeout(()=>writeState(),550);}

function renderLibrary(){
 const count=id=>data.notes.filter(n=>n.notebookId===id).length;
 el.bookList.innerHTML=data.notebooks.map(book=>`<button class="book-entry ${book.id===data.activeNotebookId?'active':''}" data-book="${book.id}" style="--book-color:${book.color}"><span class="book-icon"><svg><use href="#i-book"/></svg></span><span class="book-title">${escapeHTML(book.name)}</span><span class="book-total">${count(book.id)}</span></button>`).join('');
 $('noteCount').textContent=count(data.activeNotebookId);
 let keyword=el.noteSearch.value.trim().toLowerCase();let notes=data.notes.filter(n=>n.notebookId===data.activeNotebookId&&(n.title.toLowerCase().includes(keyword))).sort((a,b)=>b.updatedAt-a.updatedAt);

 el.bookList.querySelectorAll('[data-book]').forEach(button=>button.addEventListener('click',()=>selectBook(button.dataset.book)));

function renderHeader(){let note=currentNote(),book=currentBook();if(!note)return;el.title.value=note.title;el.crumb.textContent=book.name;}

function selectNote(id){commitTextEdit();let note=data.notes.find(n=>n.id===id);if(!note)return;data.activeNoteId=id;data.activeNotebookId=note.notebookId;data.pageIndex=0;selected=[];selectionRect=null;renderAll(true);queueSave();showSidebar(false);}

 else if(p.template==='dots'){el.paper.style.backgroundImage='radial-gradient(rgba(89,114,167,.32) 1.3px,transparent 1.3px)';el.paper.style.backgroundSize='30px 30px';}
 else{el.paper.style.backgroundImage='none';el.paper.style.backgroundSize='auto';}
}

 if(fitZoom||forceFit){zoom=fitScale();fitZoom=true;}applyZoom();

 selected=[];selectionRect=null;renderInk();renderLive();

}
function setTool(next){commitTextEdit();tool=next;pointerActivity=null;selected=[];selectionRect=null;el.toolGroup.querySelectorAll('[data-tool]').forEach(btn=>btn.classList.toggle('active',btn.dataset.tool===tool));el.paper.classList.toggle('hand-tool',tool==='hand');if(tool==='pen')el.size.value=penSize;if(tool==='marker')el.size.value=markerSize;renderPalette();renderLive();updateSizeUI();}
function renderPalette(){const colors=tool==='marker'?MARKER_COLORS:PEN_COLORS;let selectedColor=tool==='marker'?markerColor:penColor;
 el.palette.innerHTML=colors.map(c=>`<button class="swatch ${c===selectedColor?'active':''}" style="--swatch:${c}" data-color="${c}" title="${c}" aria-label="색상 ${c}"></button>`).join('');

function drawStroke(ctx,item){const pts=item.points;if(!pts||!pts.length)return;ctx.save();ctx.globalAlpha=item.tool==='marker'?.34:1;ctx.strokeStyle=item.color;ctx.fillStyle=item.color;ctx.lineCap='round';ctx.lineJoin='round';let base=item.tool==='marker'?item.size*4.0:item.size;

}
async function exportPDF(){commitTextEdit();let note=currentNote();if(!note)return;const button=$('exportBtn');if(button.disabled)return;button.disabled=true;try{let images=[];for(let i=0;i<note.pages.length;i++){$('saveStatus').textContent='PDF 생성 '+(i+1)+'/'+note.pages.length;images.push(await makePageJPEG(note.pages[i]));await new Promise(r=>setTimeout(r,0));}let blob=makePDF(images);downloadBlob(blob,(note.title||'LumiNote').replace(/[\\/:*?"<>|]/g,'_')+'.pdf');showToast(`${note.pages.length}페이지 PDF 파일이 저장되었습니다.`);}catch(e){console.error(e);showToast('PDF 저장에 실패했습니다: '+e.message,4800);}finally{button.disabled=false;el.saveStatus.textContent='저장됨';}}
async function scaleImage(file){const url=await new Promise((resolve,reject)=>{let rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=reject;rd.readAsDataURL(file);});const img=await loadImage(url),ratio=img.width/img.height;let w=ratio>1?1684:1190,h=Math.round(w/ratio);let c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);return {id:uid(),w,h,template:'plain',items:[],bgImage:c.toDataURL('image/jpeg',.85)};}
function loadPdfLib(){return new Promise((resolve,reject)=>{if(window.pdfjsLib){resolve(window.pdfjsLib);return;}let s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=()=>{if(!window.pdfjsLib){reject(new Error('PDF 라이브러리를 초기화할 수 없습니다.'));return;}window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';resolve(window.pdfjsLib);};s.onerror=()=>reject(new Error('인터넷 연결이 필요합니다. PDF 변환 모듈을 불러오지 못했습니다.'));document.head.appendChild(s);});}
async function convertPDF(file){const lib=await loadPdfLib(),bytes=await file.arrayBuffer(),doc=await lib.getDocument({data:new Uint8Array(bytes)}).promise;let result=[];let limit=Math.min(doc.numPages,100);
 for(let i=1;i<=limit;i++){el.saveStatus.textContent='PDF 가져오기 '+i+'/'+limit;const page=await doc.getPage(i),v=page.getViewport({scale:1}),ratio=v.width/v.height,w=ratio>1?1684:1190,h=Math.max(300,Math.round(w/ratio)),viewport=page.getViewport({scale:w/v.width});let canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;result.push({id:uid(),w,h,template:'plain',items:[],bgImage:canvas.toDataURL('image/jpeg',.82)});canvas.width=1;canvas.height=1;}
 if(doc.numPages>limit)showToast(`PDF가 ${doc.numPages}페이지여서 앞 ${limit}페이지만 가져왔습니다.`,5500);
 return result;}
async function importFile(file){if(!file)return;if(file.size>120*1024*1024){showToast('파일은 120MB 이내로 선택해 주세요.',4500);return;}let name=file.name.replace(/\.[^.]+$/,'').slice(0,80)||'가져온 노트';
 el.saveStatus.textContent='파일 불러오는 중…';try{
  let pages=file.type==='application/pdf'||file.name.toLowerCase().endsWith('.pdf')?await convertPDF(file):[await scaleImage(file)];
  let note=makeNote(data.activeNotebookId,name);note.pages=pages;data.notes.push(note);data.activeNoteId=note.id;data.pageIndex=0;renderAll(true);await saveImmediately();showToast(`${pages.length}페이지를 가져왔습니다. 위에 바로 필기할 수 있습니다.`,4000);
 }catch(e){console.error(e);showToast('가져오기 실패: '+e.message,5500);}finally{el.saveStatus.textContent='저장됨';el.file.value='';}}
function registerEvents(){
 $('libraryToggle').onclick=()=>showSidebar(true);$('closeSidebar').onclick=()=>showSidebar(false);el.sidebarShade.onclick=()=>showSidebar(false);
 $('newBookButton').onclick=newNotebook;$('newNoteButton').onclick=newNote;el.noteSearch.oninput=renderLibrary;
 el.title.oninput=()=>{let n=currentNote();n.title=el.title.value||'제목 없음';renderLibrary();queueSave();};el.title.onblur=()=>{let n=currentNote();if(!n.title.trim())n.title='제목 없음';renderHeader();};
 $('themeBtn').onclick=()=>{data.settings.dark=!data.settings.dark;applyTheme();queueSave();};$('moreBtn').onclick=()=>el.pop.hidden?openSettings():closePopover();$('sidebarSettings').onclick=()=>{showSidebar(false);openSettings();};
 $('importBtn').onclick=()=>el.file.click();$('exportBtn').onclick=exportPDF;
 el.file.addEventListener('change',e=>importFile(e.target.files?.[0]));
 el.backup.addEventListener('change',async e=>{let file=e.target.files?.[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!Array.isArray(obj.notebooks)||!Array.isArray(obj.notes)||!obj.notes.length)throw new Error('올바른 백업 파일이 아닙니다.');if(!confirm('현재 노트를 백업 파일 내용으로 교체할까요? 기존 데이터는 사라집니다.'))return;data=obj;data.settings??={dark:false,penOnly:true};data.pageIndex=0;imageCache.clear();undoMap.clear();redoMap.clear();renderAll(true);await saveImmediately();showToast('백업에서 노트를 복원했습니다.');}catch(ex){showToast('복원 실패: '+ex.message);}finally{el.backup.value='';}});
 el.toolGroup.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
 el.size.oninput=()=>{let val=Number(el.size.value);if(tool==='marker')markerSize=val;else penSize=val;updateSizeUI();};
 $('undoBtn').onclick=undo;$('redoBtn').onclick=redo;
 $('prevPage').onclick=()=>changePage(data.pageIndex-1);$('nextPage').onclick=()=>changePage(data.pageIndex+1);$('addPage').onclick=addPage;
 $('templateBtn').onclick=()=>el.pop.hidden?openTemplateMenu():closePopover();$('zoomIn').onclick=()=>setZoom(zoom*1.2);$('zoomOut').onclick=()=>setZoom(zoom/1.2);$('zoomFit').onclick=()=>{fitZoom=true;zoom=fitScale();applyZoom();el.stage.scrollTop=0;el.stage.scrollLeft=0;};
 el.live.addEventListener('pointerdown',onPointerDown);el.live.addEventListener('pointermove',onPointerMove);el.live.addEventListener('pointerup',onPointerUp);el.live.addEventListener('pointercancel',onPointerUp);el.live.addEventListener('lostpointercapture',e=>{if(pointerActivity?.id===e.pointerId)onPointerUp(e);});
 el.editor.addEventListener('blur',()=>commitTextEdit());el.editor.addEventListener('keydown',e=>{if(e.key==='Escape'){e.stopPropagation();commitTextEdit(true);}if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();commitTextEdit();}});
 $('modalClose').onclick=()=>closeModal(null);$('modalCancel').onclick=()=>closeModal(null);$('modalConfirm').onclick=()=>{let name=$('modalName')?.value.trim();if(!name){$('modalName').focus();return;}closeModal(name);};$('modalName');el.modal.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('modalConfirm').click();}if(e.key==='Escape')closeModal(null);});
 document.addEventListener('pointerdown',e=>{if(!el.pop.hidden&&!el.pop.contains(e.target)&&!e.target.closest('#moreBtn,#templateBtn,#sidebarSettings'))closePopover();});
 window.addEventListener('keydown',e=>{if(!el.modal.hidden)return;if(e.target.matches('input,textarea,[contenteditable]'))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();exportPDF();return;}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'){e.preventDefault();newNote();return;}
  if(e.key.toLowerCase()==='p')setTool('pen');else if(e.key.toLowerCase()==='h')setTool('marker');else if(e.key.toLowerCase()==='e')setTool('eraser');else if(e.key.toLowerCase()==='l')setTool('lasso');else if(e.key.toLowerCase()==='t')setTool('text');else if(e.key===' ')setTool('hand');
 });
 window.addEventListener('resize',()=>{if(fitZoom){zoom=fitScale();applyZoom();}});
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveImmediately();});
 window.addEventListener('beforeunload',()=>{clearTimeout(saveTimer);});
}
async function boot(){await loadState();registerEvents();renderAll(true);setTool('pen');await saveImmediately();
 if('serviceWorker' in navigator&&['http:','https:'].includes(location.protocol))navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Service worker unavailable',e));
}
boot().catch(e=>{console.error(e);showToast('앱을 초기화하지 못했습니다. 새로고침해 주세요.',6000);});

</script>
